<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="800" height="480"><style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t { font-size: 11px; fill: rgba(237,237,234,.55); }
  .hi { fill: #b6a1ff; font-weight: 600; font-size: 12px; }
  .ln { fill: none; stroke: rgba(237,237,234,.85); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .faint { fill: none; stroke: rgba(237,237,234,.08); stroke-width: 1; }
  .vio { fill: #6c3bff; }
  .vio-ln { fill: none; stroke: #b6a1ff; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.6s cubic-bezier(.16,1,.3,1) .2s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .scan { stroke: #b6a1ff; stroke-width: 1; opacity: .5; animation: scan 5s linear infinite; }
  @keyframes scan { from { transform: translateX(30px); } to { transform: translateX(375px); } }
  .fence { fill: rgba(108,59,255,.15); stroke: #b6a1ff; stroke-width: 1; transform-box: fill-box; transform-origin: center; animation: fence 2.8s ease-out infinite; }
  @keyframes fence { 0% { transform: scale(.4); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
  .lvl { fill: #6c3bff; transform-box: fill-box; transform-origin: 50% 100%; animation: charge 3.6s cubic-bezier(.77,0,.175,1) infinite alternate; }
  @keyframes charge { from { transform: scaleY(.18); } to { transform: scaleY(1); } }
  .reach { fill: rgba(108,59,255,.12); stroke: #b6a1ff; stroke-dasharray: 3 4; transform-box: fill-box; transform-origin: center; animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.06); } }
  .det { animation: det 6s ease-in-out infinite both; }
  @keyframes det { 0% { opacity: 0; } 10%, 85% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .draw { stroke-dashoffset: 0; } }
